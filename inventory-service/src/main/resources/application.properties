spring.application.name=inventory-service
server.port=${INVENTORY_SERVICE_PORT:8082}
server.shutdown=graceful

# Override these values when moving to MySQL; Spring Boot infers the JDBC driver.
spring.datasource.url=${INVENTORY_DB_URL:jdbc:h2:mem:inventorydb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${INVENTORY_DB_USERNAME:sa}
spring.datasource.password=${INVENTORY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${INVENTORY_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.mvc.problemdetails.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=inventory-service-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:ecommerce-auth}
security.jwt.audience=${JWT_AUDIENCE:ecommerce-api}

logging.pattern.level=%5p [${spring.application.name:unknown},%X{correlationId:-}]

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Inventory Service
info.app.description=Concurrency-safe stock and reservation management

app.seed.enabled=${INVENTORY_SEED_ENABLED:true}

messaging.outbox.fixed-delay=${OUTBOX_FIXED_DELAY:500ms}
messaging.outbox.batch-size=${OUTBOX_BATCH_SIZE:25}
messaging.outbox.send-timeout=${OUTBOX_SEND_TIMEOUT:10s}
