spring.application.name=inventory-service
server.port=8082
server.shutdown=graceful

spring.datasource.url=jdbc:h2:mem:inventorydb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.mvc.problemdetails.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s

security.jwt.secret=${JWT_SECRET:dev-only-ecommerce-jwt-secret-change-before-production-2026}
security.jwt.issuer=${JWT_ISSUER:ecommerce-auth}
security.jwt.audience=${JWT_AUDIENCE:ecommerce-api}

logging.pattern.level=%5p [${spring.application.name:unknown},%X{correlationId:-}]

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Inventory Service
info.app.description=Concurrency-safe stock and reservation management

app.seed.enabled=${INVENTORY_SEED_ENABLED:true}
