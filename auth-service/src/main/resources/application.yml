spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${AUTH_DB_URL:jdbc:h2:mem:authdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${AUTH_DB_USERNAME:sa}
    password: ${AUTH_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${AUTH_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${AUTH_SERVICE_PORT:8084}
  shutdown: graceful

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ecommerce-auth}
    audience: ${JWT_AUDIENCE:ecommerce-api}

auth:
  bcrypt-strength: ${AUTH_BCRYPT_STRENGTH:12}
  jwt:
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  seed:
    enabled: ${AUTH_SEED_ENABLED:false}
    admin:
      email: ${AUTH_ADMIN_EMAIL:admin@example.com}
      display-name: ${AUTH_ADMIN_DISPLAY_NAME:POC Administrator}
      password: ${AUTH_ADMIN_PASSWORD:ChangeMeAdmin123!}
    user:
      email: ${AUTH_USER_EMAIL:user@example.com}
      display-name: ${AUTH_USER_DISPLAY_NAME:POC User}
      password: ${AUTH_USER_PASSWORD:ChangeMeUser123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Auth Service
    description: JWT authentication and RBAC user administration microservice

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{correlationId:-}]"
