server:
  port: ${EUREKA_SERVER_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: eureka-server
  lifecycle:
    timeout-per-shutdown-phase: 20s

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  server:
    response-cache-update-interval-ms: ${EUREKA_RESPONSE_CACHE_INTERVAL_MS:5000}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Eureka Server
    description: Standalone service registry for the e-commerce microservices

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown}]"
