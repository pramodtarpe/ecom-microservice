server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:ordersdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

clients:
  catalog:
    base-url: ${CLIENTS_CATALOG_BASE_URL:http://localhost:8081}
    connect-timeout: ${CLIENTS_CATALOG_CONNECT_TIMEOUT:500ms}
    read-timeout: ${CLIENTS_CATALOG_READ_TIMEOUT:2s}
  inventory:
    base-url: ${CLIENTS_INVENTORY_BASE_URL:http://localhost:8082}
    connect-timeout: ${CLIENTS_INVENTORY_CONNECT_TIMEOUT:500ms}
    read-timeout: ${CLIENTS_INVENTORY_READ_TIMEOUT:2s}

security:
  jwt:
    secret: ${JWT_SECRET:ecommerce-poc-local-jwt-secret-change-before-production}
    issuer: ${JWT_ISSUER:ecommerce-auth}
    audience: ${JWT_AUDIENCE:ecommerce-api}

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 1500ms
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.ecommerce.order.error.ProductUnavailableException
          - com.ecommerce.order.error.InventoryReservationException
    instances:
      catalog:
        base-config: default
      inventory:
        base-config: default
  retry:
    instances:
      catalog:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.ecommerce.order.error.ProductUnavailableException
  bulkhead:
    instances:
      catalog:
        max-concurrent-calls: 10
        max-wait-duration: 0ms
      inventory:
        max-concurrent-calls: 10
        max-wait-duration: 0ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,bulkheadevents
  endpoint:
    health:
      probes:
        enabled: true
