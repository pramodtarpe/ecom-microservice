server:
  port: ${ORDER_SERVICE_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${ORDER_DB_URL:jdbc:h2:mem:ordersdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${ORDER_DB_USERNAME:sa}
    password: ${ORDER_DB_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: ${ORDER_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    initial-instance-info-replication-interval-seconds: 5
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

clients:
  catalog:
    base-url: ${CLIENTS_CATALOG_BASE_URL:http://product-service}
    connect-timeout: ${CLIENTS_CATALOG_CONNECT_TIMEOUT:500ms}
    read-timeout: ${CLIENTS_CATALOG_READ_TIMEOUT:2s}

messaging:
  outbox:
    fixed-delay: ${OUTBOX_FIXED_DELAY:500ms}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:10s}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ecommerce-auth}
    audience: ${JWT_AUDIENCE:ecommerce-api}

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 1500ms
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.ecommerce.order.error.ProductUnavailableException
    instances:
      catalog:
        base-config: default
  retry:
    instances:
      catalog:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.ecommerce.order.error.ProductUnavailableException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      catalog:
        max-concurrent-calls: 10
        max-wait-duration: 0ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,bulkheadevents
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Order Service
    description: Authenticated order orchestration and downstream resilience microservice

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{correlationId:-}]"
