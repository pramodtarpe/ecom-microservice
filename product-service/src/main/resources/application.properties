spring.application.name=product-service
server.port=${PRODUCT_SERVICE_PORT:8081}
server.shutdown=graceful

# Defaults to an in-memory H2 database for the proof of concept. Override these
# three values when moving to MySQL; Spring Boot will infer the JDBC driver.
spring.datasource.url=${PRODUCT_DB_URL:jdbc:h2:mem:productdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${PRODUCT_DB_USERNAME:sa}
spring.datasource.password=${PRODUCT_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${PRODUCT_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.mvc.problemdetails.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:ecommerce-auth}
security.jwt.audience=${JWT_AUDIENCE:ecommerce-api}

logging.pattern.level=%5p [${spring.application.name:unknown},%X{correlationId:-}]

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Product Service
info.app.description=Product catalog microservice

app.seed.enabled=${PRODUCT_SEED_ENABLED:true}
